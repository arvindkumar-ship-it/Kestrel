[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps08"
version = "0.1.0"
description = "PS-08 Insider Threat, Anomalous Access & Autonomous Cyber Defense platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "scikit-learn>=1.5,<2.0",
    "numpy>=2.1,<3.0",
    "networkx>=3.4,<4.0",
    "pyjwt[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "fakeredis>=2.26,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "S", "BLE", "EXE", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Synthetic demo traffic does not generate secrets or security tokens.
"apps/api/app/demo.py" = ["S311"]
"event_simulator.py" = ["S311"]
# pytest assertions are test expectations, not runtime access checks.
"apps/api/tests/*.py" = ["S101"]
