name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ps08
          POSTGRES_PASSWORD: ps08_password
          POSTGRES_DB: ps08
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ps08 -d ps08"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy apps/api/app

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://ps08:ps08_password@localhost:5432/ps08
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          pytest -q
